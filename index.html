<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e0f11">
<title>IronLOG</title>

<style>
:root{
  --bg:#0e0f11;
  --card:#17191d;
  --card2:#1d2025;
  --text:#f3f4f6;
  --muted:#969ba5;
  --line:#292d34;
  --accent:#d7ff3f;
  --danger:#ff6464;
  --good:#78e08f;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
}
button,input,select,textarea{font:inherit}
button{color:inherit}
.app{
  max-width:720px;
  margin:auto;
  padding:18px 16px 105px;
}
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:4px 0 22px;
}
.logo{
  font-size:25px;
  font-weight:800;
  letter-spacing:-.04em;
}
.logo span{color:var(--accent)}
h1{font-size:28px;margin:0 0 5px}
h2{font-size:20px;margin:0 0 8px}
.sub{color:var(--muted);font-size:14px}
.tiny{color:var(--muted);font-size:11px}
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  padding:15px;
  margin:10px 0;
}
.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}
.tag{
  color:var(--accent);
  font-size:11px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.08em;
}
.statgrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}
.stat{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:12px;
  padding:13px;
}
.stat b{font-size:20px;display:block}
.stat small{font-size:11px;color:var(--muted)}
.btn{
  border:0;
  border-radius:9px;
  padding:10px 13px;
  background:var(--accent);
  color:#111;
  font-weight:750;
}
.secondary{
  background:var(--card2);
  color:var(--text);
  border:1px solid var(--line);
}
.actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}
.actions .btn{flex:1}
.fieldgrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}
.field{margin-top:9px}
.field label{
  display:block;
  color:var(--muted);
  font-size:11px;
  margin-bottom:5px;
}
input,select,textarea{
  width:100%;
  background:var(--card2);
  border:1px solid var(--line);
  border-radius:8px;
  padding:10px;
  color:var(--text);
  outline:none;
}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{
  border-color:var(--accent);
}
.progress{
  height:6px;
  background:var(--line);
  border-radius:8px;
  overflow:hidden;
  margin:12px 0 5px;
}
.progress i{
  display:block;
  height:100%;
  background:var(--accent);
}
.section{
  font-size:18px;
  font-weight:750;
  margin:20px 0 8px;
}
.notice{
  background:var(--card2);
  border:1px solid var(--line);
  padding:11px 12px;
  border-radius:9px;
  font-size:13px;
}
.notice.good{border-color:#426c4b}
.notice.warn{border-color:#765f35}
.listrow{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:11px 0;
  border-top:1px solid var(--line);
}
.listrow:first-child{border-top:0}
.pill{
  background:var(--card2);
  border-radius:7px;
  padding:4px 7px;
  font-size:11px;
}
.exercise{
  padding:15px 0;
  border-top:1px solid var(--line);
}
.exercise:first-child{border-top:0}
.exname{font-weight:700;font-size:16px}
.focus{font-size:12px;color:var(--muted);margin-top:3px}
.setgrid{
  display:grid;
  grid-template-columns:45px 1fr 1fr;
  gap:7px;
  align-items:center;
  margin-top:10px;
}
.setgrid span{font-size:12px;color:var(--muted)}
input[type=checkbox]{
  width:20px;
  height:20px;
  accent-color:var(--accent);
}
.chart{
  width:100%;
  height:210px;
  display:block;
}
.chartline{
  fill:none;
  stroke:var(--accent);
  stroke-width:3;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.chartdot{fill:var(--accent)}
.chartlabel{fill:var(--muted);font-size:10px}
.meal{
  padding:12px 0;
  border-top:1px solid var(--line);
}
.meal:first-child{border-top:0}
.nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:rgba(14,15,17,.97);
  backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
  z-index:10;
}
.navin{
  max-width:720px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(5,1fr);
}
.nav button{
  background:none;
  border:0;
  padding:10px 3px 12px;
  color:var(--muted);
  font-size:10px;
}
.nav button.active{
  color:var(--accent);
  font-weight:700;
}
.empty{
  text-align:center;
  padding:35px 10px;
  color:var(--muted);
}
@media(max-width:430px){
  .statgrid{grid-template-columns:repeat(3,1fr)}
  .fieldgrid{grid-template-columns:1fr 1fr}
}
</style>
</head>

<body>
<div id="root"></div>

<script>
/* =========================
   IRONLOG DATA
========================= */

const WORKOUTS={
Mon:{

 ex:[

  ["Hanging Knee Raise","Abs","10–15",2]
 ]},

}
};

const STORAGE="ironlog_v2";

let state;

try{
 state=JSON.parse(
  localStorage.getItem(STORAGE) ||
  localStorage.getItem("ironlog_v1") ||
  "null"
 );
}catch(e){state=null}

if(!state){
 state={
  page:"home",
  logs:{},
  checkins:[],
  steps:{},
  diet:{},
  goalWeight:75,
  settings:{
   height:180,
   sex:"male",
   stepGoal:10000,
   calorieGoal:2200,
   proteinGoal:100,
   carbGoal:170,
   fatGoal:67
  }
 }
}

state.logs=state.logs||{};
state.checkins=state.checkins||[];
state.steps=state.steps||{};
state.diet=state.diet||{};
state.settings=state.settings||{};

Object.assign({
 height:180,
 sex:"male",
 stepGoal:10000,
 calorieGoal:2200,
 proteinGoal:100,
 carbGoal:170,
 fatGoal:67
},state.settings);

function save(){
 localStorage.setItem(STORAGE,JSON.stringify(state));
}

function today(){
 return new Date().toISOString().slice(0,10);
}

function dayName(){
 return ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][new Date().getDay()];
}

function esc(s){
 return String(s).replace(/'/g,"\\'");
}

function go(page){
 state.page=page;
 save();
 render();
}

/* =========================
   MONDAY CHECK-IN
========================= */

function mondayDate(){
 const d=new Date();
 const day=d.getDay();
 const diff=day===0?-6:1-day;
 d.setDate(d.getDate()+diff);
 return d.toISOString().slice(0,10);
}

function isMonday(){
 return new Date().getDay()===1;
}

function thisMondayCheckin(){
 return state.checkins.find(x=>x.date===mondayDate());
}

/* US Navy body-fat estimate.
   Male: height, neck, waist.
   Female: height, neck, waist, hips.
*/
function calculateBF(){
 const h=+document.getElementById("mHeight").value;
 const neck=+document.getElementById("mNeck").value;
 const waist=+document.getElementById("mWaist").value;
 const hips=+document.getElementById("mHips").value;
 const sex=document.getElementById("mSex").value;

 if(!h || !neck || !waist) return null;

 const H=h/2.54;
 const N=neck/2.54;
 const W=waist/2.54;
 const Hip=hips/2.54;

 let bf;

 if(sex==="female"){
  if(!hips) return null;
  bf=
   163.205*Math.log10(W+Hip-N)
   -97.684*Math.log10(H)
   -78.387;
 }else{
  if(W<=N) return null;
  bf=
   86.010*Math.log10(W-N)
   -70.041*Math.log10(H)
   +36.76;
 }

 return Math.max(2,Math.min(60,bf));
}

function saveCheckin(){
 if(!isMonday()){
  alert("Body check-ins are available every Monday.");
  return;
 }

 const date=mondayDate();

 const c={
  date,
  weight:+document.getElementById("mWeight").value||0,
  neck:+document.getElementById("mNeck").value||0,
  shoulders:+document.getElementById("mShoulders").value||0,
  chest:+document.getElementById("mChest").value||0,
  waist:+document.getElementById("mWaist").value||0,
  hips:+document.getElementById("mHips").value||0,
  leftArm:+document.getElementById("mLeftArm").value||0,
  rightArm:+document.getElementById("mRightArm").value||0,
  leftForearm:+document.getElementById("mLeftForearm").value||0,
  rightForearm:+document.getElementById("mRightForearm").value||0,
  leftThigh:+document.getElementById("mLeftThigh").value||0,
  rightThigh:+document.getElementById("mRightThigh").value||0,
  leftCalf:+document.getElementById("mLeftCalf").value||0,
  rightCalf:+document.getElementById("mRightCalf").value||0,
  bf:calculateBF(),
  notes:document.getElementById("mNotes").value
 };

 const old=state.checkins.findIndex(x=>x.date===date);

 if(old>=0) state.checkins[old]=c;
 else state.checkins.push(c);

 state.weight=c.weight;
 state.settings.height=+document.getElementById("mHeight").value||180;
 state.settings.sex=document.getElementById("mSex").value;

 save();
 alert("Monday check-in saved.");
 render();
}

/* =========================
   BODY PAGE
========================= */

function input(id,label,value=""){
 return `
 <div class="field">
  <label>${label}</label>
  <input id="${id}" value="${value||""}" inputmode="decimal">

}

function body(){
 const old=thisMondayCheckin();

 if(!isMonday()){
  return `
  <h1>Body</h1>
  <div class="sub">Weekly Monday check-in</div>

  <div class="notice warn">
   Your official body check-in is every Monday.
   <br><br>
   Next check-in: <b>Monday</b>
  </div>

  ${bodyHistory()}
  `;
 }

 return `
 <h1>Body Check-in</h1>
 <div class="sub">Weekly Monday measurement</div>

 <div class="notice good">
  ${old?"You already have a check-in for this Monday. Saving again will update it.":"Today's Monday check-in is ready."}
 </div>

 <div class="card">
  <h2>Basic</h2>

  <div class="fieldgrid">
   ${input("mWeight","Weight (kg)",old?.weight||state.weight)}
   ${input("mHeight","Height (cm)",old?.height||state.settings.height||180)}

   <div class="field">
    <label>Sex</label>
    <select id="mSex">
     <option value="male" ${state.settings.sex==="male"?"selected":""}>Male</option>
     <option value="female" ${state.settings.sex==="female"?"selected":""}>Female</option>
    </select>
   </div>

   ${input("mNeck","Neck (cm)",old?.neck)}
  </div>
 </div>

 <div class="card">
  <h2>Measurements</h2>

  <div class="fieldgrid">
   ${input("mShoulders","Shoulders (cm)",old?.shoulders)}
   ${input("mChest","Chest (cm)",old?.chest)}
   ${input("mWaist","Waist (cm)",old?.waist)}
   ${input("mHips","Hips (cm)",old?.hips)}
   ${input("mLeftArm","Left arm (cm)",old?.leftArm)}
   ${input("mRightArm","Right arm (cm)",old?.rightArm)}
   ${input("mLeftForearm","Left forearm (cm)",old?.leftForearm)}
   ${input("mRightForearm","Right forearm (cm)",old?.rightForearm)}
   ${input("mLeftThigh","Left thigh (cm)",old?.leftThigh)}
   ${input("mRightThigh","Right thigh (cm)",old?.rightThigh)}
   ${input("mLeftCalf","Left calf (cm)",old?.leftCalf)}
   ${input("mRightCalf","Right calf (cm)",old?.rightCalf)}
  </div>

  <div class="field">
   <label>Notes</label>
   <textarea id="mNotes">${old?.notes||""}</textarea>
  </div>

  <div class="actions">
   <button class="btn" onclick="saveCheckin()">Save Monday Check-in</button>
  </div>
 </div>

 <div class="card">
  <h2>Automatic body-fat estimate</h2>
  <div class="tiny">
   Uses your height, neck and waist measurements with the US Navy formula.
   It is an estimate, not a clinical measurement.
  </div>
 </div>

 ${bodyHistory()}
 `;
}

function bodyHistory(){
 const arr=state.checkins
  .slice()
  .sort((a,b)=>b.date.localeCompare(a.date));

 return `
 <div class="section">Check-in history</div>

 <div class="card">
 ${
 arr.length
 ?
 arr.map(c=>`
  <div class="listrow">
   <span>
    <b>${c.date}</b>
    <div class="tiny">
     Waist ${c.waist||"—"} cm
    </div>
   </span>
   <span>
    ${c.weight||"—"} kg
    <br>
    <span class="pill">${c.bf?c.bf.toFixed(1)+"% BF":"—"}</span>
   </span>
  </div>
 `).join("")
 :
 `<div class="empty">No Monday check-ins yet.</div>`
 }
 </div>

 <div class="actions">
  <button class="btn secondary" onclick="go('progress')">
   View Progress
  </button>
 </div>
 `;
}

/* =========================
   CHARTS
========================= */

function chart(data,key,unit){
 if(data.length<2){
  return `<div class="empty">Add at least 2 Monday check-ins to see this graph.</div>`;
 }

 const vals=data
  .map(x=>+x[key])
  .filter(x=>Number.isFinite(x)&&x>0);

 if(!vals.length) return `<div class="empty">No data yet.</div>`;

 const min=Math.min(...vals);
 const max=Math.max(...vals);
 const range=max-min||1;

 const W=640,H=190;
 const pad=28;

 const pts=data
  .map((x,i)=>{
   const v=+x[key];
   if(!v)return null;

   const px=pad+(i/(data.length-1))*(W-pad*2);
   const py=H-pad-((v-min)/range)*(H-pad*2);

   return [px,py,v,x.date];
  })
  .filter(Boolean);

 const path=pts.map((p,i)=>
  `${i?"L":"M"} ${p[0]} ${p[1]}`
 ).join(" ");

 return `
 <svg class="chart" viewBox="0 0 ${W} ${H}">
  <line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}"
   stroke="#292d34"/>
  <path d="${path}" class="chartline"/>
  ${pts.map(p=>`
   <circle cx="${p[0]}" cy="${p[1]}" r="4" class="chartdot"/>
  `).join("")}
  <text x="${pad}" y="14" class="chartlabel">
   ${max.toFixed(1)}${unit}
  </text>
  <text x="${pad}" y="${H-5}" class="chartlabel">
   ${min.toFixed(1)}${unit}
  </text>
  <text x="${W-pad-70}" y="${H-5}" class="chartlabel">
   ${pts[pts.length-1][3]}
  </text>
 </svg>
 `;
}

function progress(){
 const data=state.checkins
  .slice()
  .sort((a,b)=>a.date.localeCompare(b.date));

 const metrics=[
  ["weight","Weight"," kg"],
  ["bf","Body Fat","%"],
  ["waist","Waist"," cm"],
  ["chest","Chest"," cm"],
  ["shoulders","Shoulders"," cm"],
  ["hips","Hips"," cm"],
  ["leftArm","Left Arm"," cm"],
  ["rightArm","Right Arm"," cm"],
  ["leftForearm","Left Forearm"," cm"],
  ["rightForearm","Right Forearm"," cm"],
  ["leftThigh","Left Thigh"," cm"],
  ["rightThigh","Right Thigh"," cm"],
  ["leftCalf","Left Calf"," cm"],
  ["rightCalf","Right Calf"," cm"]
 ];

 return `
 <h1>Progress</h1>
 <div class="sub">Your weekly Monday trends</div>

 <div class="card">
  <div class="row">
   <b>Weight goal</b>
   <span>${state.goalWeight||75} kg</span>
  </div>
  ${
   data.length
   ?
   `<div class="tiny" style="margin-top:7px">
    Current: ${data[data.length-1].weight||"—"} kg
    • Goal: ${state.goalWeight||75} kg
   </div>`
   :
   ""
  }
 </div>

 ${metrics.map(m=>`
  <div class="card">
   <div class="row">
    <b>${m[1]}</b>
    <span class="tiny">
     ${
      data.length && data[data.length-1][m[0]]
      ? data[data.length-1][m[0]]+m[2]
      : "—"
     }
    </span>
   </div>
   ${chart(data,m[0],m[2])}
  </div>
 `).join("")}
 `;
}

/* =========================
   STEPS
========================= */

function steps(){
 const todaySteps=state.steps[today()]||0;
 const goal=state.settings.stepGoal||10000;

 const dates=Object.keys(state.steps).sort();
 const last7=dates.slice(-7);

 const avg=last7.length
  ? Math.round(
   last7.reduce((sum,d)=>sum+(+state.steps[d]||0),0)/last7.length
  )
  : 0;

 return `
 <h1>Steps</h1>
 <div class="sub">Daily activity tracking</div>

 <div class="statgrid">
  <div class="stat">
   <b>${Number(todaySteps).toLocaleString()}</b>
   <small>Today</small>
  </div>
  <div class="stat">
   <b>${Number(goal).toLocaleString()}</b>
   <small>Goal</small>
  </div>
  <div class="stat">
   <b>${avg.toLocaleString()}</b>
   <small>7-day avg</small>
  </div>
 </div>

 <div class="card">
  <h2>Today's steps</h2>

  ${input("stepInput","Steps",todaySteps)}
  ${input("stepGoal","Daily goal",goal)}

  <div class="progress">
   <i style="width:${Math.min(100,todaySteps/goal*100)}%"></i>
  </div>

  <div class="tiny">
   ${Math.round(todaySteps/goal*100)}% of today's goal
  </div>

  <div class="actions">
   <button class="btn" onclick="saveSteps()">Save Steps</button>
  </div>
 </div>

 <div class="card">
  <h2>Recent days</h2>

  ${
   dates.length
   ?
   dates.slice(-14).reverse().map(d=>`
    <div class="listrow">
     <span>${d}</span>
     <span>
      ${Number(state.steps[d]).toLocaleString()}
      <span class="pill">
       ${Math.round(state.steps[d]/goal*100)}%
      </span>
     </span>
    </div>
   `).join("")
   :
   `<div class="empty">No step entries yet.</div>`
  }
 </div>
 `;
}

function saveSteps(){
 const n=Math.max(
  0,
  Math.floor(+document.getElementById("stepInput").value||0)
 );

 const goal=Math.max(
  1,
  Math.floor(+document.getElementById("stepGoal").value||10000)
 );

 state.steps[today()]=n;
 state.settings.stepGoal=goal;

 save();
 render();
}

/* =========================
   DIET
========================= */

function diet(){
 const d=state.diet[today()]||{
  meals:[],
  cal:0,
  p:0,
  c:0,
  f:0
 };

 const g=state.settings;

 return `
 <h1>Diet</h1>
 <div class="sub">Daily nutrition tracker</div>

 <div class="statgrid">
  <div class="stat">
   <b>${d.cal||0}</b>
   <small>kcal / ${g.calorieGoal}</small>
  </div>

  <div class="stat">
   <b>${d.p||0}g</b>
   <small>protein / ${g.proteinGoal}g</small>
  </div>

  <div class="stat">
   <b>${d.c||0}g</b>
   <small>carbs / ${g.carbGoal}g</small>
  </div>
 </div>

 <div class="card">
  <div class="row">
   <b>Calories</b>
   <span>${Math.max(0,g.calorieGoal-d.cal)} remaining</span>
  </div>

  <div class="progress">
   <i style="width:${Math.min(100,d.cal/g.calorieGoal*100)}%"></i>
  </div>

  <div class="tiny">
   Protein ${d.p||0}/${g.proteinGoal}g
   • Carbs ${d.c||0}/${g.carbGoal}g
   • Fat ${d.f||0}/${g.fatGoal}g
  </div>
 </div>

 <div class="card">
  <h2>Add Food</h2>

  <div class="fieldgrid">
   ${input("foodName","Food")}
   ${input("foodCal","Calories")}
   ${input("foodP","Protein (g)")}
   ${input("foodC","Carbs (g)")}
   ${input("foodF","Fat (g)")}
  </div>

  <div class="field">
   <label>Meal</label>
   <select id="foodMeal">
    <option>Breakfast</option>
    <option>Lunch</option>
    <option>Pre-workout</option>
    <option>Post-workout</option>
    <option>Dinner</option>
    <option>Snack</option>
   </select>
  </div>

  <div class="actions">
   <button class="btn" onclick="addFood()">Add Food</button>
  </div>
 </div>

 <div class="card">
  <h2>Today's food</h2>

  ${
   d.meals.length
   ?
   d.meals.map((m,i)=>`
    <div class="meal">
     <div class="row">
      <span>
       <b>${m.name}</b>
       <div class="tiny">${m.meal}</div>
      </span>
      <button class="iconbtn secondary" onclick="removeFood(${i})">×</button>
     </div>

     <div class="tiny" style="margin-top:6px">
      ${m.cal} kcal
      • P ${m.p}g
      • C ${m.c}g
      • F ${m.f}g
     </div>
    </div>
   `).join("")
   :
   `<div class="empty">Nothing logged today.</div>`
  }
 </div>

 <div class="card">
  <div class="row">
   <b>Diet targets</b>
   <button class="btn secondary" onclick="editDietGoals()">Edit</button>
  </div>

  <div class="tiny" style="margin-top:7px">
   ${g.calorieGoal} kcal
   • ${g.proteinGoal}g protein
   • ${g.carbGoal}g carbs
   • ${g.fatGoal}g fat
  </div>
 </div>
 `;
}

function addFood(){
 const name=document.getElementById("foodName").value.trim();

 if(!name){
  alert("Enter a food name.");
  return;
 }

 const food={
  name,
  meal:document.getElementById("foodMeal").value,
  cal:+document.getElementById("foodCal").value||0,
  p:+document.getElementById("foodP").value||0,
  c:+document.getElementById("foodC").value||0,
  f:+document.getElementById("foodF").value||0
 };

 const d=state.diet[today()]||{
  meals:[],cal:0,p:0,c:0,f:0
 };

 d.meals.push(food);
 d.cal+=food.cal;
 d.p+=food.p;
 d.c+=food.c;
 d.f+=food.f;

 state.diet[today()]=d;

 save();
 render();
}

function removeFood(i){
 const d=state.diet[today()];
 if(!d)return;

 const m=d.meals[i];

 d.cal-=m.cal;
 d.p-=m.p;
 d.c-=m.c;
 d.f-=m.f;

 d.meals.splice(i,1);

 save();
 render();
}

function editDietGoals(){
 const c=+prompt(
  "Daily calories",
  state.settings.calorieGoal
 )||state.settings.calorieGoal;

 const p=+prompt(
  "Protein grams",
  state.settings.proteinGoal
 )||state.settings.proteinGoal;

 const carbs=+prompt(
  "Carbs grams",
  state.settings.carbGoal
 )||state.settings.carbGoal;

 const f=+prompt(
  "Fat grams",
  state.settings.fatGoal
 )||state.settings.fatGoal;

 state.settings.calorieGoal=c;
 state.settings.proteinGoal=p;
 state.settings.carbGoal=carbs;
 state.settings.fatGoal=f;

 save();
 render();
}

/* =========================
   WORKOUT
========================= */

function workout(){
 const day=state.activeDay||dayName();
 const d=WORKOUTS[day];

 if(day==="Sun"){
  return `
  <h1>Recovery</h1>
  <div class="sub">Sunday</div>
  <div class="card empty">
   Recovery is part of the program.
  </div>
  `;
 }

 const date=state.activeDate||today();
 const log=state.logs[date]||{ex:{}};

 const completed=d.ex.filter(
  e=>log.ex[e[0]]?.done
 ).length;

 return `
 <div class="row">
  <div>
   <h1>${d.name}</h1>
   <div class="sub">${day} • ${d.sub}</div>
  </div>
  <button class="btn secondary" onclick="go('home')">×</button>
 </div>

 <div class="card">
  <div class="row">
   <span class="tag">Workout progress</span>
   <span class="tiny">${completed}/${d.ex.length}</span>
  </div>

  <div class="progress">
   <i style="width:${completed/d.ex.length*100}%"></i>
  </div>
 </div>

 <div class="card">
  ${d.ex.map((e,i)=>exercise(e,i,log)).join("")}
 </div>

 <div class="actions">
  <button class="btn" onclick="finishWorkout()">
   Finish Workout
  </button>
 </div>

 <div class="tiny" style="margin-top:12px">
  Warm-ups are separate. Compounds: 2–3 min rest.
  Isolations: 60–90 sec. Work around 1–2 RIR initially
  and 0–1 RIR on final hard sets.
 </div>
 `;
}

function previousExercise(name){
 const arr=[];

 for(const [date,l] of Object.entries(state.logs)){
  if(l.ex?.[name]){
   arr.push({
    date,
    ...l.ex[name]
   });
  }
 }

 arr.sort((a,b)=>b.date.localeCompare(a.date));

 return arr[0];
}

function exercise(e,index,log){
 const[name,focus,range,sets]=e;

 const old=previousExercise(name);
 const current=log.ex[name]||{s:[]};

 let html="";

 for(let i=0;i<sets;i++){
  const s=current.s[i]||{};

  html+=`
   <div class="setgrid">
    <span>Set ${i+1}</span>

    <input
     inputmode="decimal"
     placeholder="kg"
     value="${s.w||""}"
     onchange="editSet('${esc(name)}',${i},'w',this.value)"
    >

    <input
     inputmode="numeric"
     placeholder="reps"
     value="${s.r||""}"
     onchange="editSet('${esc(name)}',${i},'r',this.value)"
    >
   </div>
  `;
 }

 let previous="No previous log";

 if(old){
  previous=old.s.map(s=>
   s.w&&s.r
   ? `${s.w}kg × ${s.r}`
   : "—"
  ).join(" / ");
 }

 return `
 <div class="exercise">

  <div class="row">
   <div>
    <div class="exname">${name}</div>
    <div class="focus">
     ${focus} • ${range} • ${sets} working sets
    </div>
   </div>

   <input
    type="checkbox"
    ${current.done?"checked":""}
    onchange="markExercise('${esc(name)}',this.checked)"
   >
  </div>

  ${html}

  <div class="tiny" style="margin-top:9px">
   Previous: <b>${previous}</b>
  </div>

 </div>
 `;
}

function ensureLog(){
 const date=state.activeDate||today();

 if(!state.logs[date]){
  state.logs[date]={ex:{}};
 }

 return state.logs[date];
}

function editSet(name,index,key,value){
 const l=ensureLog();

 l.ex[name]=l.ex[name]||{s:[]};
 l.ex[name].s[index]=l.ex[name].s[index]||{};

 l.ex[name].s[index][key]=value;

 save();
}

function markExercise(name,value){
 const l=ensureLog();

 l.ex[name]=l.ex[name]||{s:[]};
 l.ex[name].done=value;

 save();
 render();
}

function finishWorkout(){
 const l=ensureLog();

 l.finishedAt=new Date().toISOString();

 save();

 alert("Workout saved. Nice work.");
 go("home");
}

function startWorkout(day){
 state.activeDay=day;
 state.activeDate=dateForDay(day);
 state.page="workout";

 save();
 render();
}

function dateForDay(day){
 const map={
  Sun:0,
  Mon:1,
  Tue:2,
  Wed:3,
  Thu:4,
  Fri:5,
  Sat:6
 };

 const now=new Date();
 let diff=map[day]-now.getDay();

 if(diff>0)diff-=7;

 const d=new Date(now);
 d.setDate(now.getDate()+diff);

 return d.toISOString().slice(0,10);
}

/* =========================
   HOME
========================= */

function home(){
 const day=dayName();
 const workout=WORKOUTS[day];

 const todayLog=state.logs[today()]||{ex:{}};

 const completed=workout.ex.filter(
  e=>todayLog.ex[e[0]]?.done
 ).length;

 const pct=workout.ex.length
  ? Math.round(completed/workout.ex.length*100)
  : 0;

 const latest=state.checkins
  .slice()
  .sort((a,b)=>b.date.localeCompare(a.date))[0];

 const weight=latest?.weight||state.weight||"—";

 const steps=state.steps[today()]||0;

 return `
 <h1>${day==="Sun"?"Recovery":"Today"}</h1>

 <div class="sub">
  ${new Date().toLocaleDateString(undefined,{
   weekday:"long",
   month:"short",

  })}
 </div>

 <div class="card">
  <div class="tag">${day}</div>
  <h2 style="margin-top:5px">${workout.name}</h2>
  <div class="sub">${workout.sub}</div>

  ${
   workout.ex.length
   ?
   `
   <div class="progress">
    <i style="width:${pct}%"></i>

 </div>

 <div class="statgrid">
  <div class="stat">
   <b>${weight}</b>

  </div>

  <div class="stat">
   <b>${bf}</b>
   <small>Body fat</small>
  </div>

  <div class="stat">
   <b>${Number(steps).toLocaleString()}</b>
   <small>Steps</small>
  </div>
 </div>

 <div class="card">
  <div class="row">
   <b>Monday Check-in</b>
   <span class="tiny">
    ${isMonday()?"Due today":"Weekly"}
   </span>
  </div>

  <div class="tiny" style="margin-top:7px">
   Weight, measurements and automatic body-fat estimate.
  </div>

  <div class="actions">
   <button class="btn secondary" onclick="go('body')">
    ${isMonday()?"Do Check-in":"View Body"}
   </button>
  </div>
 </div>

 <div class="card">
  <div class="row">
   <b>Goal</b>
   <span>${state.goalWeight||75} kg</span>
  </div>

  <div class="tiny" style="margin-top:7px">
   Current ${weight} kg
  </div>
 </div>

}

/* =========================
   HISTORY
========================= */

  .sort((a,b)=>b[0].localeCompare(a[0]));

/* =========================
   SETTINGS
========================= */

function settings(){
 return `
 <h1>Settings</h1>
 <div class="sub">IronLOG preferences</div>

 <div class="card">
  <h2>Goals</h2>

  ${input("goalInput","Goal weight (kg)",state.goalWeight||75)}

  <div class="actions">
   <button class="btn" onclick="saveGoals()">
    Save Goal
   </button>
  </div>
 </div>

 <div class="card">
  <h2>Backup</h2>

  <div class="tiny">
   Your IronLOG data is stored locally in this browser.
   Export a backup regularly so you don't lose it.
  </div>

  <div class="actions">
   <button class="btn secondary" onclick="backup()">
    Export Data
   </button>

   <button class="btn secondary" onclick="restore()">
    Import Data
   </button>
  </div>
 </div>

 <div class="card">
  <h2>Reset</h2>

  <div class="tiny">
   This permanently clears all locally stored IronLOG data.
  </div>

  <div class="actions">
   <button class="btn secondary" onclick="resetData()">
    Reset IronLOG
   </button>
  </div>
 </div>
 `;
}

function saveGoals(){
 const v=+document.getElementById("goalInput").value;

 if(v>0){
  state.goalWeight=v;
  save();
  render();
 }
}

function resetData(){
 if(!confirm("Delete all IronLOG data?"))return;

 localStorage.removeItem(STORAGE);
 localStorage.removeItem("ironlog_v1");

 location.reload();
}

/* =========================
   BACKUP
========================= */

function backup(){
 const blob=new Blob(
  [JSON.stringify(state,null,2)],
  {type:"application/json"}
 );

 const a=document.createElement("a");

 a.href=URL.createObjectURL(blob);
 a.download="ironlog-backup.json";
 a.click();

 setTimeout(()=>{
  URL.revokeObjectURL(a.href);
 },1000);
}

function restore(){
 const input=document.createElement("input");

 input.type="file";
 input.accept=".json";

 input.onchange=()=>{
  const file=input.files[0];

  if(!file)return;

  const reader=new FileReader();

  reader.onload=()=>{
   try{
    const imported=JSON.parse(reader.result);

    if(!imported || typeof imported!=="object"){
     throw new Error();
    }

    state=Object.assign({
     page:"home",
     logs:{},
     checkins:[],
     steps:{},
     diet:{},
     goalWeight:75,
     settings:{
      height:180,
      sex:"male",
      stepGoal:10000,
      calorieGoal:2200,
      proteinGoal:100,
      carbGoal:170,
      fatGoal:67
     }
    },imported);

    save();
    render();

   }catch(e){
    alert("Invalid IronLOG backup.");
   }
  };

  reader.readAsText(file);
}

/* =========================
   NAVIGATION
========================= */

function render(){
 const p=state.page||"home";

 let content;

 if(p==="home")content=home();
 else if(p==="body")content=body();
 else if(p==="progress")content=progress();
 else if(p==="steps")content=steps();
 else if(p==="diet")content=diet();
 else if(p==="workout")content=workout();
 else if(p==="history")content=historyPage();
 else if(p==="settings")content=settings();
 else content=home();

 root.innerHTML=`
  <div class="app">

   <header>
    <div class="logo">
     Iron<span>LOG</span>
    </div>

    <button class="btn secondary" onclick="backup()">
     ↥
    </button>
   </header>

   ${content}

  </div>

  <nav class="nav">
   <div class="navin">

    <button
     class="${p==="home"?"active":""}"
     onclick="go('home')">
     Home
    </button>

    <button
     class="${p==="workout"?"active":""}"
     onclick="go('workout')">
     Workout
    </button>

    <button
     class="${p==="body"||p==="progress"?"active":""}"
     onclick="go('body')">
     Body
    </button>

    <button
     class="${p==="steps"||p==="diet"?"active":""}"
     onclick="go('steps')">
     Activity
    </button>

    <button
     class="${p==="history"||p==="settings"?"active":""}"
     onclick="go('history')">
     More
    </button>

   </div>
  </nav>
 `;
}

/* More page shortcut */
document.addEventListener("click",function(e){
 if(e.target.closest(".nav button") && state.page==="history"){
  // history remains the main More area
 }
});

render();
</script>

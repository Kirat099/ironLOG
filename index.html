<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b0e">
<title>IronLOG</title>

<style>
:root{
  --bg:#090b0e;
  --card:#11151a;
  --card2:#171c22;
  --line:#252c34;
  --text:#f2f4f7;
  --muted:#8e98a5;
  --accent:#d7ff4f;
  --danger:#ff6675;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button,input{font:inherit}
button{color:inherit}

.app{
  max-width:760px;
  margin:auto;
  min-height:100vh;
  padding:18px 16px 105px;
}

header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:24px;
}

.logo{
  font-size:25px;
  font-weight:850;
  letter-spacing:-1px;
}

.logo span{color:var(--accent)}

.top-actions{
  display:flex;
  gap:8px;
}

.icon{
  width:42px;
  height:42px;
  border:1px solid var(--line);
  background:var(--card);
  border-radius:12px;
  display:grid;
  place-items:center;
  font-size:18px;
}

h1{
  font-size:29px;
  margin:0 0 5px;
  letter-spacing:-.7px;
}

.sub{
  color:var(--muted);
  font-size:14px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  padding:16px;
  margin-top:14px;
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

.tag,.pill{
  display:inline-flex;
  padding:5px 9px;
  border-radius:999px;
  background:var(--card2);
  color:var(--muted);
  font-size:11px;
  font-weight:700;
}

.tag{color:var(--accent)}

.btn{
  border:0;
  background:var(--accent);
  color:#090b0e;
  font-weight:800;
  border-radius:11px;
  padding:12px 15px;
}

.btn.secondary{
  background:var(--card2);
  color:var(--text);
  border:1px solid var(--line);
}

.btn.danger{
  background:#2a1519;
  color:#ff8d99;
  border:1px solid #482027;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:14px;
}

.statgrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin-top:14px;
}

.stat{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  padding:13px;
}

.stat b{
  display:block;
  font-size:20px;
}

.stat small{
  display:block;
  color:var(--muted);
  font-size:11px;
  margin-top:3px;
}

.progress{
  height:7px;
  background:#20262d;
  border-radius:20px;
  overflow:hidden;
  margin-top:13px;
}

.progress i{
  display:block;
  height:100%;
  background:var(--accent);
  border-radius:20px;
}

.tiny{
  font-size:12px;
  color:var(--muted);
}

/* Bottom navigation */
.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:rgba(9,11,14,.97);
  border-top:1px solid var(--line);
  padding:8px 10px env(safe-area-inset-bottom);
  z-index:10;
}

.nav{
  max-width:760px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:5px;
}

.nav button{
  background:none;
  border:0;
  color:var(--muted);
  padding:8px 3px;
  font-size:11px;
  font-weight:700;
  border-radius:10px;
}

.nav button.active{
  color:var(--accent);
  background:#171c20;
}

/* Forms */
.fieldgrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:11px;
}

.field label{
  display:block;
  color:var(--muted);
  font-size:11px;
  margin-bottom:6px;
}

.field input{
  width:100%;
  background:#0c0f13;
  border:1px solid var(--line);
  color:var(--text);
  border-radius:10px;
  padding:11px;
}

.field input:disabled{
  opacity:.45;
}

.section{
  font-weight:800;
  margin-top:19px;
}

.notice{
  padding:12px;
  border-radius:12px;
  background:#171c20;
  border:1px solid var(--line);
  font-size:13px;
  color:var(--muted);
  margin-top:12px;
}

.notice.good{
  color:var(--accent);
}

/* Workout day selector */
.daybar{
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding-bottom:2px;
  margin-top:14px;
}

.daybar button{
  flex:0 0 auto;
  border:1px solid var(--line);
  background:var(--card);
  border-radius:10px;
  padding:9px 12px;
  font-size:12px;
  color:var(--muted);
}

.daybar button.active{
  background:var(--accent);
  color:#090b0e;
  border-color:var(--accent);
  font-weight:800;
}

/* Exercises */
.exercise{
  border-top:1px solid var(--line);
  padding:15px 0;
}

.exercise:first-child{
  border-top:0;
}

.exercise-title{
  font-weight:800;
}

.sets{
  display:grid;
  gap:7px;
  margin-top:10px;
}

.setrow{
  display:grid;
  grid-template-columns:30px 1fr 1fr 42px;
  gap:6px;
  align-items:center;
}

.setrow span{
  font-size:11px;
  color:var(--muted);
}

.setrow input{
  width:100%;
  background:#0c0f13;
  border:1px solid var(--line);
  color:var(--text);
  border-radius:8px;
  padding:9px;
}

.check{
  width:28px;
  height:28px;
  accent-color:#d7ff4f;
}

/* Graph */
.chart{
  height:170px;
  background:#0c0f13;
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px;
  margin-top:10px;
}

.chart svg{
  width:100%;
  height:100%;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:30px 10px;
}

/* Settings */
@media(min-width:700px){
  .app{
    padding-bottom:90px;
  }
}
</style>
</head>

<body>

<div id="root"></div>

<script>

const KEY="ironlog_v3";

const old=JSON.parse(localStorage.getItem(KEY)||"null");

const legacy=
  JSON.parse(localStorage.getItem("ironlog_v2")||
             localStorage.getItem("ironlog_v1")||
             "null");

let state=old||{
  page:"home",
  activeDay:null,
  activeDate:null,
  checkins:[],
  steps:{},
  logs:{},
  diet:{},
  settings:{
    goalWeight:75,
    stepGoal:10000
  }
};

if(!old && legacy){
  state={
    ...state,
    ...legacy,
    page:"home",
    settings:{
      ...state.settings,
      ...(legacy.settings||{})
    }
  };
}

state.settings=state.settings||{
  goalWeight:75,
  stepGoal:10000
};

function save(){
  localStorage.setItem(KEY,JSON.stringify(state));
}

function today(){
  return new Date().toISOString().slice(0,10);
}

function dayKey(date=today()){
  return [
    "Sun",
    "Mon",
    "Tue",
    "Wed",
    "Thu",
    "Fri",
    "Sat"
  ][new Date(date+"T12:00:00").getDay()];
}

function mondayDate(d=new Date()){
  let x=new Date(d);
  let n=x.getDay();

  x.setDate(
    x.getDate()-
    (n===0?6:n-1)
  );

  return x.toISOString().slice(0,10);
}

function isMonday(){
  return new Date().getDay()===1;
}

function fmt(d){
  return new Date(d+"T12:00:00")
    .toLocaleDateString(undefined,{
      weekday:"short",
      month:"short",
      day:"numeric"
    });
}

function nextMonday(){

  let d=new Date();

  let add=(8-d.getDay())%7;

  if(add===0)add=7;

  d.setDate(d.getDate()+add);

  return d.toLocaleDateString(undefined,{
    weekday:"long",
    month:"short",
    day:"numeric"
  });
}


/* =========================
   WORKOUT PLAN
========================= */

const PLAN={

Mon:{
  name:"Push",
  sub:"Chest • Shoulders • Triceps",
  ex:[
    ["Incline Bench Press",2,"8–12"],
    ["Pec Deck",2,"10–15"],
    ["Shoulder Press Machine",2,"8–12"],
    ["Cable/Dumbbell Lateral Raise",2,"10–15"],
    ["Rope Pushdown",2,"8–12"],
    ["Overhead Cable Triceps Extension",2,"10–15"]
  ]
},

Tue:{
  name:"Pull",
  sub:"Back • Biceps",
  ex:[
    ["Lat Pulldown",2,"8–12"],
    ["Incline Bench-Supported Barbell Row",2,"8–12"],
    ["Seated Cable Row",2,"8–12"],
    ["Cable Crossover Rear-Delt Fly",2,"10–15"],
    ["Preacher Curl",2,"8–12"],
    ["Rope Hammer Curl",2,"8–12"]
  ]
},

Wed:{
  name:"Legs + Abs",
  sub:"Quads • Hamstrings • Calves • Abs",
  ex:[
    ["Leg Press",2,"8–12"],
    ["Leg Curl",2,"8–12"],
    ["Leg Extension",2,"10–15"],
    ["Standing Calf Raise",2,"10–15"],
    ["Cable Crunch",2,"10–15"]
  ]
},

Thu:{
  name:"Chest + Back",
  sub:"Chest • Back",
  ex:[
    ["Incline Bench Press",3,"8–12"],
    ["High-to-Low Cable Fly",3,"10–15"],
    ["Flat Dumbbell Press",3,"8–12"],
    ["Lat Pulldown",3,"8–12"],
    ["Single-Arm Dumbbell Row",3,"8–12"],
    ["Straight-Arm Cable Pulldown",3,"10–15"]
  ]
},

Fri:{
  name:"Shoulders + Arms + Forearms",
  sub:"Shoulders • Biceps • Triceps • Forearms",
  ex:[
    ["Shoulder Press Machine",3,"8–12"],
    ["Cable Lateral Raise",2,"10–15"],
    ["Preacher Curl",3,"8–12"],
    ["Incline Dumbbell Curl",2,"8–12"],
    ["Rope Pushdown",3,"8–12"],
    ["Overhead Cable Triceps Extension",2,"10–15"],
    ["Wrist Curl",2,"12–15"],
    ["Reverse Wrist Curl",2,"12–15"]
  ]
},

Sat:{
  name:"Legs + Abs",
  sub:"Posterior Chain • Quads • Calves • Abs",
  ex:[
    ["Conventional Deadlift",2,"6–8"],
    ["Leg Press",3,"8–12"],
    ["Leg Curl",3,"8–12"],
    ["Leg Extension",2,"10–15"],
    ["Standing Calf Raise",3,"10–15"],
    ["Hanging Knee Raise",2,"10–15"]
  ]
},

Sun:{
  name:"Recovery",
  sub:"Rest day",
  ex:[]
}

};


/* =========================
   NAVIGATION
========================= */

function go(p){
  state.page=p;
  save();
  render();
}


/* =========================
   HOME
========================= */

function home(){

  const d=dayKey();

  const p=PLAN[d];

  const log=state.logs[today()]||{};

  const done=p.ex.filter(
    (e,i)=>log.ex?.[i]?.done
  ).length;

  const c=state.checkins
    .slice()
    .sort((a,b)=>b.date.localeCompare(a.date))[0];

  const steps=state.steps[today()]||0;

  return `

  <h1>${d==="Sun"?"Recovery":"Today"}</h1>

  <div class="sub">
    ${fmt(today())}
  </div>

  <div class="card">

    <div class="row">
      <span class="tag">${d}</span>
      <span class="pill">${p.name}</span>
    </div>

    <div style="
      font-size:20px;
      font-weight:850;
      margin-top:10px">
      ${p.sub}
    </div>

    ${
      p.ex.length
      ?
      `
      <div class="progress">
        <i style="
          width:${done/p.ex.length*100}%">
        </i>
      </div>

      <div class="tiny" style="margin-top:6px">
        ${done}/${p.ex.length} exercises complete
      </div>
      `
      :
      `
      <div class="notice">
        Recovery day. No workout scheduled.
      </div>
      `
    }

    <div class="actions">

      <button
        class="btn"
        onclick="go('workout')">

        ${
          p.ex.length
          ?"Open today's workout"
          :"View workout week"
        }

      </button>

    </div>

  </div>


  <div class="statgrid">

    <div class="stat">
      <b>${c?.weight??"—"}</b>
      <small>Latest weight kg</small>
    </div>

    <div class="stat">
      <b>
        ${
          c?.bf
          ?c.bf.toFixed(1)+"%"
          :"—"
        }
      </b>
      <small>Body fat est.</small>
    </div>

    <div class="stat">
      <b>${Number(steps).toLocaleString()}</b>
      <small>Steps today</small>
    </div>

  </div>


  <div class="card">

    <div class="row">
      <b>Body check-in</b>
      <span class="pill">Monday only</span>
    </div>

    <div class="tiny" style="margin-top:7px">

      ${
        isMonday()
        ?"Your weekly check-in is open today."
        :"Next check-in: "+nextMonday()
      }

    </div>

    <div class="actions">

      <button
        class="btn secondary"
        onclick="go('body')">

        Open Body

      </button>

    </div>

  </div>

  `;

}


/* =========================
   WORKOUT PAGE
========================= */

function workout(){

  let d=state.activeDay||dayKey();

  let date=state.activeDate||today();

  let p=PLAN[d];

  return `

  <h1>${p.name}</h1>

  <div class="sub">
    ${d} • ${fmt(date)} • ${p.sub}
  </div>


  <div class="daybar">

    ${
      ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"]
      .map(x=>`

        <button
          class="${d===x?"active":""}"
          onclick="selectDay('${x}')">

          ${x}

        </button>

      `)
      .join("")
    }

  </div>


  ${
    p.ex.length
    ?
    `

    <div class="card">

      <div class="row">

        <b>
          ${
            d===dayKey() && date===today()
            ?"Today's workout"
            :"Selected workout"
          }
        </b>

        <span class="pill">
          ${date}
        </span>

      </div>


      ${
        p.ex
        .map((e,i)=>exercise(e,i,date,d))
        .join("")
      }

    </div>

    `
    :
    `

    <div class="card empty">

      Sunday is your recovery day.

    </div>

    `
  }

  `;

}


function selectDay(d){

  state.activeDay=d;

  state.activeDate=weekDate(d);

  save();

  render();
}


function weekDate(d){

  let now=new Date();

  let map={
    Sun:0,
    Mon:1,
    Tue:2,
    Wed:3,
    Thu:4,
    Fri:5,
    Sat:6
  };

  let diff=map[d]-now.getDay();

  let x=new Date(now);

  x.setDate(
    now.getDate()+diff
  );

  return x.toISOString().slice(0,10);
}


function exercise(e,i,date,d){

  let log=
    state.logs[date]?.ex?.[i]||{};

  let prev=previous(e[0],date);

  let sets=[];

  for(
    let s=0;
    s<e[1];
    s++
  ){

    let v=log.sets?.[s]||{};

    sets.push(`

      <div class="setrow">

        <span>${s+1}</span>

        <input
          inputmode="decimal"
          placeholder="kg"
          value="${v.w||""}"
          onchange="
            saveSet(
              '${date}',
              '${d}',
              ${i},
              ${s},
              'w',
              this.value
            )
          "
        >

        <input
          inputmode="numeric"
          placeholder="reps"
          value="${v.r||""}"
          onchange="
            saveSet(
              '${date}',
              '${d}',
              ${i},
              ${s},
              'r',
              this.value
            )
          "
        >

        <input
          class="check"
          type="checkbox"
          ${v.done?"checked":""}
          onchange="
            saveSet(
              '${date}',
              '${d}',
              ${i},
              ${s},
              'done',
              this.checked
            )
          "
        >

      </div>

    `);

  }


  return `

  <div class="exercise">

    <div class="row">

      <div class="exercise-title">
        ${i+1}. ${e[0]}
      </div>

      <span class="pill">
        ${e[1]} × ${e[2]}
      </span>

    </div>


    ${
      prev
      ?
      `
      <div
        class="tiny"
        style="margin-top:5px">

        Previous: ${prev}

      </div>
      `
      :""
    }


    <div class="sets">

      <div class="setrow">

        <span></span>
        <span>Weight</span>
        <span>Reps</span>
        <span>✓</span>

      </div>

      ${sets.join("")}

    </div>

  </div>

  `;

}


function previous(name,date){

  let arr=Object
    .keys(state.logs)
    .filter(x=>x<date)
    .sort()
    .reverse();

  for(let d of arr){

    let p=PLAN[dayKey(d)];

    let idx=p?.ex.findIndex(
      x=>x[0]===name
    );

    if(idx>=0){

      let s=
        state.logs[d]
        ?.ex
        ?.[idx]
        ?.sets||[];

      let done=
        s.filter(x=>x.w||x.r);

      if(done.length){

        return done
          .map(x=>
            (x.w?x.w+"kg":"—")+
            (x.r?" × "+x.r:"")
          )
          .join(", ");

      }

    }

  }

  return "";
}


function saveSet(
  date,
  d,
  i,
  s,
  key,
  val
){

  state.logs[date]=
    state.logs[date]||
    {ex:{}};

  state.logs[date].ex[i]=
    state.logs[date].ex[i]||
    {sets:[]};

  state.logs[date]
    .ex[i]
    .sets=
    state.logs[date]
      .ex[i]
      .sets||[];

  state.logs[date]
    .ex[i]
    .sets[s]=
    state.logs[date]
      .ex[i]
      .sets[s]||{};

  state.logs[date]
    .ex[i]
    .sets[s][key]=val;

  if(key==="done"){

    state.logs[date]
      .ex[i]
      .done=
      state.logs[date]
        .ex[i]
        .sets
        .every(x=>x?.done);

  }

  save();

}


/* =========================
   BODY
========================= */

function body(){

  let c=
    state.checkins.find(
      x=>x.date===mondayDate()
    );

  let last=
    state.checkins
      .slice()
      .sort(
        (a,b)=>b.date.localeCompare(a.date)
      )[0];


  return `

  <h1>Body</h1>

  <div class="sub">
    Weekly measurements • Monday only
  </div>


  ${
    !isMonday()
    ?
    `
    <div class="notice">

      🔒 Check-in locked.

      <br>

      New weight and measurements
      can only be entered on Monday.

      <br><br>

      <b style="color:var(--text)">
        Next check-in: ${nextMonday()}
      </b>

    </div>
    `
    :
    `
    <div class="notice good">

      ✓ Today's Monday check-in is open.

    </div>
    `
  }


  <div class="card">

    <div class="row">

      <b>
        ${
          isMonday()
          ?"Weekly check-in"
          :"Latest check-in"
        }
      </b>

      <span class="pill">
        ${c?.date||last?.date||"—"}
      </span>

    </div>


    <div class="section">
      Core measurements
    </div>


    <div class="fieldgrid">

      ${field(
        "weight",
        "Weight (kg)",
        c?.weight??last?.weight??"",
        !isMonday()
      )}

      ${field(
        "height",
        "Height (cm)",
        c?.height??last?.height??180,
        !isMonday()
      )}

      ${field(
        "neck",
        "Neck (cm)",
        c?.neck??last?.neck??"",
        !isMonday()
      )}

      ${field(
        "waist",
        "Waist (cm)",
        c?.waist??last?.waist??"",
        !isMonday()
      )}

    </div>


    <div class="section">
      Body-fat estimate
    </div>


    <div class="notice">

      Uses the U.S. Navy circumference
      method from height, neck and waist.

      <br>

      It is an estimate, not a medical measurement.

    </div>


    <div
      id="bfPreview"
      class="stat"
      style="margin-top:10px">

      <b>
        ${
          c?.bf
          ?c.bf.toFixed(1)+"%"
          :
          last?.bf
          ?last.bf.toFixed(1)+"%"
          :"—"
        }
      </b>

      <small>
        Estimated body fat
      </small>

    </div>


    ${
      isMonday()
      ?
      `
      <div class="actions">

        <button
          class="btn"
          onclick="saveBody()">

          Save Monday check-in

        </button>

      </div>
      `
      :""
    }

  </div>


  <div class="card">

    <b>
      Latest recorded data
    </b>

    ${
      last
      ?
      `

      <div class="listrow">
        <span>Weight</span>
        <span>${last.weight} kg</span>
      </div>

      <div class="listrow">
        <span>Body fat</span>
        <span>${last.bf?.toFixed(1)||"—"}%</span>
      </div>

      <div class="listrow">
        <span>Waist</span>
        <span>${last.waist||"—"} cm</span>
      </div>

      `
      :
      `
      <div class="empty">
        No body check-ins yet.
      </div>
      `
    }

  </div>

  `;

}


function field(
  id,
  label,
  val,
  disabled
){

  return `

  <div class="field">

    <label>${label}</label>

    <input
      id="${id}"
      inputmode="decimal"
      value="${val}"
      ${disabled?"disabled":""}
      oninput="previewBF()"
    >

  </div>

  `;

}


function calcBF(
  waist,
  neck,
  height
){

  waist=+waist;
  neck=+neck;
  height=+height;

  if(
    !(waist>neck&&
      neck>0&&
      height>0)
  ){
    return null;
  }

  let wi=waist/2.54;
  let ni=neck/2.54;
  let hi=height/2.54;

  return Math.max(
    2,
    Math.min(
      60,
      86.010*Math.log10(wi-ni)
      -
      70.041*Math.log10(hi)
      +
      36.76
    )
  );

}


function previewBF(){

  let el=
    document.getElementById("bfPreview");

  if(!el)return;

  let b=calcBF(
    document.getElementById("waist")?.value,
    document.getElementById("neck")?.value,
    document.getElementById("height")?.value
  );

  el.innerHTML=`

    <b>
      ${b?b.toFixed(1)+"%":"—"}
    </b>

    <small>
      Estimated body fat
    </small>

  `;

}


function saveBody(){

  let w=
    +document.getElementById("weight").value;

  let h=
    +document.getElementById("height").value;

  let n=
    +document.getElementById("neck").value;

  let wa=
    +document.getElementById("waist").value;

  if(!w||!h||!n||!wa){

    alert(
      "Fill in weight, height, neck and waist."
    );

    return;
  }

  let bf=calcBF(
    wa,
    n,
    h
  );

  let item={
    date:mondayDate(),
    weight:w,
    height:h,
    neck:n,
    waist:wa,
    bf:bf
  };

  state.checkins=
    state.checkins.filter(
      x=>x.date!==item.date
    );

  state.checkins.push(item);

  save();

  render();

}
<script>

/* =========================
   STEPS
========================= */

function steps(){

      state.steps[today()]||0

  let goal=
    Number(
      state.settings.stepGoal||10000
    );


  return `

  <h1>Steps</h1>

  <div class="sub">
    Daily activity tracking
  </div>


  <div class="statgrid">

    <div class="stat">
      <b>${n.toLocaleString()}</b>
      <small>Today</small>
    </div>

    <div class="stat">
      <b>${goal.toLocaleString()}</b>

    </div>

    <div class="stat">
      <b>
        ${Math.min(
          100,
          Math.round(n/goal*100)
        )}%
      </b>
      <small>Goal reached</small>
    </div>

  </div>


  <div class="card">

    <b>Today's steps</b>


    <div

      style="margin-top:10px">

      <label>Steps</label>

      <input
        id="stepsInput"
        inputmode="numeric"
        value="${n}"
      >

    <div
      class="field"
      style="margin-top:10px">

      <label>Daily goal</label>

      <input

        inputmode="numeric"
        value="${goal}"
      >

    </div>


    <div class="actions">

      <button
        class="btn"
        onclick="saveSteps()">

        Save steps

      </button>

    </div>

  </div>


  <div class="card">

    <b>Recent days</b>

    ${

      .keys(state.steps)
      .sort()
      .reverse()
      .slice(0,14)
      .map(d=>`

        <div class="listrow">

          <span>${fmt(d)}</span>

          <span>
            ${Number(
              state.steps[d]
            ).toLocaleString()}

        </div>

      .join("")
      ||
      `
      <div class="empty">

      </div>
      `

  </div>

  `;

}


function saveSteps(){

  state.steps[today()]=
    Math.max(
      0,
      Math.floor(
        +document
          .getElementById("stepsInput")
          .value||0
      )
    );


  state.settings.stepGoal=
    Math.max(
      1,
      Math.floor(
        +document
          .getElementById("stepGoal")
          .value||10000
      )
    );


  save();

  render();

}


/* =========================
   DIET
========================= */

function diet(){

  return `

  <h1>Diet</h1>

  <div class="sub">
    Nutrition tracking
  </div>


  <div class="card empty">

    Diet tracking is reserved
    for the next IronLOG update.

    <br><br>

    No food or macro data is
    being recorded yet.

  </div>

  `;

}


/* =========================
   PROGRESS
========================= */

function progress(){

  let checks=
    state.checkins
      .slice()
      .sort(
        (a,b)=>
          a.date.localeCompare(b.date)
      );


  let labels=
    checks.map(
      x=>fmt(x.date)
    );


  let weights=
    checks.map(
      x=>+x.weight
    );


  let bfChecks=
    checks.filter(
      x=>x.bf
    );


  return `

  <h1>Progress</h1>

  <div class="sub">
    Your overall training and body progress
  </div>


  <div class="statgrid">

    <div class="stat">

      <b>
        ${checks.at(-1)?.weight??"—"}
      </b>

      <small>
        Latest kg
      </small>

    </div>


    <div class="stat">

      <b>

        ${
          checks.at(-1)?.bf
          ?
          checks
            .at(-1)
            .bf
            .toFixed(1)+"%"
          :
          "—"
        }

      </b>

      <small>
        Latest BF
      </small>

    </div>


    <div class="stat">

      <b>
        ${state.settings.goalWeight}
      </b>

      <small>
        Goal kg
      </small>

    </div>

  </div>


  <div class="card">

    <b>Weight</b>

    ${
      weights.length>1
      ?
      chart(
        weights,
        labels,
        " kg"
      )
      :
      `
      <div class="empty">

        Add at least two Monday
        check-ins to see the weight graph.

      </div>
      `
    }

  </div>


  <div class="card">

    <b>Body-fat %</b>

    ${
      bfChecks.length>1
      ?
      chart(
        bfChecks.map(x=>x.bf),
        bfChecks.map(x=>fmt(x.date)),
        "%"
      )
      :
      `
      <div class="empty">

        More body check-ins are needed
        for a graph.

      </div>
      `
    }

  </div>


  <div class="card">

    <b>Workout & activity</b>


    <div class="listrow">

      <span>
        Logged workout days
      </span>

      <span>
        ${Object.keys(state.logs).length}
      </span>

    </div>


    <div class="listrow">

      <span>
        Step days logged
      </span>

      <span>
        ${Object.keys(state.steps).length}
      </span>

    </div>


    <div class="listrow">

      <span>
        Goal weight
      </span>

      <span>
        ${state.settings.goalWeight} kg
      </span>

    </div>

  </div>

  `;

}


function chart(
  vals,
  labels,
  suffix
){

  let min=Math.min(...vals);

  let max=Math.max(...vals);

  let range=max-min||1;

  let w=500;

  let h=140;

  let p=12;


  let pts=
    vals.map(
      (v,i)=>
        `${p+i*(w-2*p)/
        Math.max(
          1,
          vals.length-1
        )},
        ${h-p-
        (v-min)/range*
        (h-2*p)}`
    )
    .join(" ");


  return `

  <div class="chart">

    <svg
      viewBox="0 0 ${w} ${h}"
      preserveAspectRatio="none">

      <polyline
        fill="none"
        stroke="#d7ff4f"
        stroke-width="3"
        points="${pts}"
      />

      ${
        vals.map(
          (v,i)=>{

            let parts=
              pts
              .split(" ")[i]
              .split(",");

            let x=parts[0];

            let y=parts[1];

            return `

              <circle
                cx="${x}"
                cy="${y}"
                r="4"
                fill="#d7ff4f"
              />

            `;

          }
        ).join("")
      }

    </svg>

  </div>


  <div
    class="tiny"
    style="margin-top:7px">

    ${labels[0]}
    →
    ${labels.at(-1)}

    •
    ${min.toFixed(1)}
    ${suffix}
    to
    ${max.toFixed(1)}
    ${suffix}

  </div>

  `;

}


/* =========================
   SETTINGS
========================= */

function settings(){

  return `

  <h1>Settings</h1>

  <div class="sub">
    IronLOG preferences and backups
  </div>


  <div class="card">

    <div class="field">

      <label>
        Goal weight (kg)
      </label>

      <input
        id="goal"
        inputmode="decimal"
        value="${state.settings.goalWeight}"
      >

    </div>


    <div class="actions">

      <button
        class="btn"
        onclick="saveSettings()">

        Save settings

      </button>

    </div>

  </div>


  <div class="card">

    <b>Data</b>


    <div class="actions">

      <button
        class="btn secondary"
        onclick="backup()">

        Export backup

      </button>


      <button
        class="btn secondary"
        onclick="
          document
          .getElementById('importFile')
          .click()
        ">

        Import backup

      </button>


      <button
        class="btn danger"
        onclick="resetAll()">

        Reset all data

      </button>

    </div>


    <input
      id="importFile"
      type="file"
      accept=".json"
      hidden
      onchange="importBackup(this)"
    >

  </div>

  `;

}


function saveSettings(){

  state.settings.goalWeight=
    +document
      .getElementById("goal")
      .value||75;

  save();

  render();

}


function backup(){

  let a=document.createElement("a");

  a.href=
    "data:application/json;charset=utf-8,"+
    encodeURIComponent(
      JSON.stringify(state)
    );

  a.download=
    "ironlog-backup.json";

  a.click();

}


function importBackup(input){

  let f=input.files[0];

  if(!f)return;

  let r=new FileReader();

  r.onload=()=>{

    try{

      state=JSON.parse(r.result);

      save();

      render();

    }
    catch(e){

      alert(
        "Invalid backup file."
      );

    }

  };

  r.readAsText(f);

}


function resetAll(){

  if(
    confirm(
      "Reset all IronLOG data? This cannot be undone."
    )
  ){

    localStorage.removeItem(KEY);

    location.reload();

  }

}


/* =========================
   MAIN RENDER
========================= */

function render(){

  let p=state.page||"home";


  let content=
    p==="home"
    ?home()
    :
    p==="workout"
    ?workout()
    :
    p==="body"
    ?body()
    :
    p==="steps"
    ?steps()
    :
    p==="diet"
    ?diet()
    :
    p==="progress"
    ?progress()
    :
    settings();


  document.getElementById("root").innerHTML=

  `

  <div class="app">

    <header>

      <div class="logo">
        Iron<span>LOG</span>
      </div>


      <div class="top-actions">

        <!-- BODY IS TOP-RIGHT -->

        <button
          class="icon"
          title="Body"
          onclick="go('body')">

          ⚖️

        </button>


        <!-- SETTINGS IS TOP-RIGHT -->

        <button
          class="icon"
          title="Settings"
          onclick="go('settings')">

          ⚙️

        </button>

      </div>

    </header>


    ${content}

  </div>


  <!-- MAIN TABS ONLY -->

  <div class="bottom">

    <nav class="nav">


      <button
        class="${p==="home"?"active":""}"
        onclick="go('home')">

        ⌂
        <br>
        Home

      </button>


      <button
        class="${p==="workout"?"active":""}"
        onclick="go('workout')">

        ▣
        <br>
        Workout

      </button>


      <button
        class="${p==="steps"?"active":""}"
        onclick="go('steps')">

        ↗
        <br>
        Steps

      </button>


      <button
        class="${p==="diet"?"active":""}"
        onclick="go('diet')">

        +
        <br>
        Diet

      </button>


      <button
        class="${p==="progress"?"active":""}"
        onclick="go('progress')">

        ◒
        <br>
        Progress

      </button>


    </nav>

  </div>

  `;

}


render();

</script>
